services:
  agent:
    build: .
    command:
      - -agent-id=agent-001
      - -interval=5s
      - -ops-address=:8080
      - -otlp-endpoint=jaeger:4318
      - -database=/data/wattfeder.db
    ports:
      - "8080:8080"
    volumes:
      - wattfeder-data:/data
    depends_on:
      - jaeger

  # Both images are pinned: `make compose-up` should start the same environment next year as it
  # does today.
  prometheus:
    image: prom/prometheus:v3.13.2
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - agent

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"

volumes:
  wattfeder-data:
