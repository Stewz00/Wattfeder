services:
  agent:
    build: .
    command:
      - -agent-id=agent-001
      - -interval=5s
      - -ops-address=:8080
      - -otlp-endpoint=jaeger:4318
      - -database=/data/wattfeder.db
    ports:
      - "8080:8080"
    volumes:
      - wattfeder-data:/data
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - agent

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"

volumes:
  wattfeder-data:
